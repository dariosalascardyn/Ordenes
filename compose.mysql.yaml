services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: db_ordenes
      MYSQL_ALLOW_EMPTY_PASSWORD: "${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}"
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - eventpass-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=root", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  eventpass-mysql-data:
