

# =========================================================
# CONFIGURACIÓN DEL SERVIDOR
# =========================================================
# Puerto local donde correrá el microservicio de Órdenes
server.port=${SERVER_PORT:8083}

# Nombre de la aplicación
spring.application.name=ordenes

# Configuracion local opcional para JWT y URLs de microservicios.
spring.config.import=optional:file:.env[.properties]
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=${JWT_ISSUER:eventpass-users}

# =========================================================
# CONEXIÓN A BASE DE DATOS (MySQL / XAMPP)
# =========================================================
# URL de conexión a MySQL. "createDatabaseIfNotExist=true" crea BD  automáticamente
spring.datasource.url=jdbc:mysql://localhost:3306/db_ordenes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Usuario por defecto de MySQL en XAMPP
spring.datasource.username=root

# Contraseña por defecto de XAMPP es vacía (déjala en blanco salvo que le hayas puesto clave a root)
spring.datasource.password=

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =========================================================
# 'update' crea o actualiza las tablas en MySQL automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL ejecutadas en la consola para depurar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# URLS DE LOS OTROS MICROSERVICIOS
# =========================================================
# Definimos las URLs de los microservicios con los que se comunicará Órdenes
servicios.eventos.url=${EVENTOS_URL:http://localhost:8084}
servicios.tickets.url=${TICKETS_URL:http://localhost:8081}
